{% extends 'base.html' %}
{% load static %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Подтверждение удаления</h4>
            </div>
            <div class="card-body">
                <p class="fs-5">Вы уверены, что хотите удалить товар <strong>"{{ object.name }}"</strong>?</p>
                <p class="text-muted">Это действие нельзя отменить.</p>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i>Отмена
                </a>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash me-1"></i>Удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
