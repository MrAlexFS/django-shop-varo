{% load static %}
<div class="card h-100 shadow-sm product-card">
    <div class="position-relative">
        <!-- Кликабельное изображение товара -->
        <a href="{% url 'catalog:product_detail' product.slug %}">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: contain; background-color: #f8f9fa; padding: 10px;">
            {% else %}
                <div class="bg-light text-center p-4" style="height: 200px;">
                    <i class="fas fa-image fa-3x text-muted mt-4"></i>
                </div>
            {% endif %}
        </a>
        <!-- Иконки поверх изображения -->
        <div class="position-absolute top-0 end-0 p-2 d-flex gap-2">
            <a href="#" class="btn btn-sm btn-light rounded-circle shadow-sm" title="В избранное">
                <i class="far fa-heart text-danger"></i>
            </a>
            <button class="btn btn-sm btn-light rounded-circle shadow-sm cart-toggle"
                data-product-id="{{ product.id }}"
                data-in-cart="{% if product.id in cart_product_ids %}true{% else %}false{% endif %}"
                title="Добавить в корзину">
                <i class="fas fa-shopping-cart {% if product.id in cart_product_ids %}text-success{% else %}text-primary{% endif %}"></i>
            </button>
        </div>
    </div>
    <div class="card-body d-flex flex-column">
        <!-- Кликабельное название товара -->
        <h5 class="card-title">
            <a href="{% url 'catalog:product_detail' product.slug %}" class="text-decoration-none text-dark">{{ product.name|truncatechars:60 }}</a>
        </h5>
        <!-- Рейтинг (заглушка) -->
        <div class="d-flex align-items-center mb-2">
            <span class="text-warning me-1">★ 4.7</span>
            <small class="text-muted">| 48 отзывов</small>
        </div>
        <!-- Цена -->
        <p class="fw-bold text-primary h5 mt-auto">{{ product.price }} ₽</p>
        <!-- Ежемесячный платёж (заглушка) -->
        <small class="text-muted">от 11 698 ₽/мес.</small>
        <!-- Информация о доставке (заглушка) -->
        <div class="mt-2 small">
            <p class="mb-0"><i class="fas fa-truck me-1"></i> При заказе послезавтра</p>
            <p class="mb-0"><i class="far fa-calendar-alt me-1"></i> Доставим на дом {{ delivery_date|default:"18 марта (ср)" }}</p>
            <p class="mb-0"><i class="fas fa-store me-1"></i> Пункты выдачи доступны</p>
        </div>
    </div>
</div>
