<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Каталог товаров{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 (иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Дополнительные стили -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .footer {
            margin-top: 3rem;
            padding: 1rem 0;
            color: #6c757d;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }
        /* Анимация для сообщений */
        .alert {
            border-radius: 0.5rem;
        }
        .product-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15) !important;
        }
        .card-img-top {
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            background-color: #f8f9fa;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <svg width="auto" height="40" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                    <!-- Синий круг с молнией -->
                    <circle cx="30" cy="30" r="24" fill="#0d6efd"/>
                    <path d="M26 18 L26 28 L20 28 L34 42 L34 32 L40 32 L26 18Z" fill="white"/>
                    <!-- Текст VaroTechZone -->
                    <text x="60" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="white">VaroTechZone</text>
                </svg>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:user_catalog' %}">
                            <i class="fas fa-list me-1"></i>Каталог
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cart:cart_detail' %}">
                            <i class="fas fa-shopping-cart"></i> Корзина
                            <span class="badge bg-primary">{{ cart|length }}</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контейнер -->
    <main class="container my-4">
        <!-- Блок для сообщений -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        <!-- Контент страницы будет здесь -->
        {% endblock %}
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <span class="text-muted">&copy; {% now "Y" %} Мой магазин. Все права защищены.</span>
        </div>
    </footer>

    <!-- Bootstrap JS (для работы навигационной панели и закрытия сообщений) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
    <script>
document.addEventListener('DOMContentLoaded', function() {
    // Функция для получения CSRF-токена из cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // Обработчик клика по кнопкам корзины
    document.querySelectorAll('.cart-toggle').forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            const productId = this.dataset.productId;
            const wasInCart = this.dataset.inCart === 'true'; // текущее состояние

            // Отправляем POST-запрос
            fetch('{% url "cart:cart_toggle" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': csrftoken
                },
                body: new URLSearchParams({
                    'product_id': productId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'added') {
                    // Товар добавлен
                    this.dataset.inCart = 'true';
                    this.querySelector('i').classList.remove('text-primary');
                    this.querySelector('i').classList.add('text-success');
                    this.title = 'Убрать из корзины';
                } else if (data.status === 'removed') {
                    // Товар удалён
                    this.dataset.inCart = 'false';
                    this.querySelector('i').classList.remove('text-success');
                    this.querySelector('i').classList.add('text-primary');
                    this.title = 'Добавить в корзину';
                }
                // Обновляем счётчик корзины в шапке (если есть)
                const cartBadge = document.querySelector('.navbar .badge');
                if (cartBadge) {
                    cartBadge.textContent = data.cart_total;
                }
            })
            .catch(error => console.error('Ошибка:', error));
        });
    });
});
</script>
</body>
</html>
